<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Formulario EBAC </title>
        <link rel="stylesheet" href="./main.css">
    </head>
    <body>
        <div class="container">
            <h1> Formulario EBAC </h1>
            <form id="formulario">
                <input type="number" id="variavelA" required placeholder="variavel A" />
                <input type="number" id="variavelB" required placeholder="variavel B" />
                <p class="maior"> A variavél B tem que ser maior que A, mude de valor ! </p>
                <button id="validar" validar="submit"> Validação </button>    
            </form>
            <p class="msg-sucesso"></p>
        </div>
        <script src="./main.js"></script>
    </body>
</html>
